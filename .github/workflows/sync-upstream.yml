name: Sync upstream

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream changes
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tintinweb/pi-subagents.git
          git fetch origin master sync-upstream || true
          git fetch upstream master

          if git show-ref --verify --quiet refs/remotes/origin/sync-upstream; then
            git switch --create sync-upstream --track origin/sync-upstream
            git merge --no-edit origin/master
          else
            git switch --create sync-upstream origin/master
          fi

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-edit upstream/master
          git push origin sync-upstream
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update sync pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh pr list -R "${{ github.repository }}" --head sync-upstream --base master --state open --json number --jq 'length > 0' | grep -qx true; then
            exit 0
          fi
          gh pr create \
            -R "${{ github.repository }}" \
            --base master \
            --head sync-upstream \
            --title "chore: sync upstream" \
            --body "Automated sync from https://github.com/tintinweb/pi-subagents."

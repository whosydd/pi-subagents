name: Sync upstream

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream changes into master
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tintinweb/pi-subagents.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "master is already up to date with upstream/master"
            exit 0
          fi

          echo "merging upstream/master ($(git rev-parse --short upstream/master)) into master"
          git merge --no-edit upstream/master

          # GITHUB_TOKEN cannot push changes under .github/workflows/, so restore the
          # workflow files exactly as they are on origin/master. Upstream workflow
          # updates are therefore excluded from the automatic sync and must be
          # merged manually.
          if ! git diff --quiet origin/master HEAD -- .github/workflows; then
            echo "reverting upstream changes under .github/workflows (sync them manually)"
            git diff --name-status origin/master HEAD -- .github/workflows
            git rm -r --quiet --ignore-unmatch .github/workflows
            git checkout origin/master -- .github/workflows
            git commit --no-edit -m "sync: keep fork workflow files, exclude upstream workflow changes"
          fi

          git push origin HEAD:master
          echo "master synced with upstream/master"
